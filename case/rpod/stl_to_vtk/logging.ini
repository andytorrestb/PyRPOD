# PyRPOD logging configuration for the stl_to_vtk utility case.
#
# Read by pyrpod.logging_utils.configure_logging(case_dir). See docs/logging.md
# and docs/logging.ini.example for the full schema.
#
# This case does not run a plume-strike sweep; it demonstrates the asset-load
# provenance/checksum logging and directory-creation logging around a simple
# STL -> VTK conversion. progress_every_n_firings is unused here.

[logging]
enabled = true
console = true
file = true
level = INFO
log_array_stats = true
log_performance = true
snapshot_config = true
checksum_inputs = true
